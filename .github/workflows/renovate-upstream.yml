name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/cchecksum'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/cchecksum/.github/workflows/renovate-upstream-reviewed-linux.yml@0b627545c37fc33f67ba890dcaeb97efd859df69
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
