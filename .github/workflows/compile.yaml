name: Compile
concurrency:
  group: pr-ci-compile.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INCLUDE_PATHS: "[]"
          CI_IGNORE_PATHS: '[".github/workflows/**","!.github/workflows/compile.yaml"]'
        run: python3 .github/scripts/ci_changes.py
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: "requirements.txt

            requirements-dev.txt

            pyproject.toml

            setup.py

            "
      - name: Install dependencies
        run: python -m pip install -r requirements.txt Cython==3.3.0 setuptools
      - name: Build Cython extensions
        run: make cython
      - name: Verify generated C is current
        run: git diff --exit-code -- cchecksum/_checksum.c
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (compile.yaml)
    if: ${{ !cancelled() }}
    needs:
      - ci_changes
      - build-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify validation contract
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["build-ubuntu"]'
        run:
          "python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

          python3 .github/scripts/ci_gate.py"
"on":
  pull_request:
    branches:
      - master
    paths:
      - "**"
